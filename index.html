<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RexSave</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #2e8b57;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}
.container {
  background: rgba(0,0,0,0.25);
  padding: 25px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.4);
}
.title {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #00ff99;
}
input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  margin-bottom: 12px;
}
button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #00ff99;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #33ffad;
}
.result {
  margin-top: 15px;
  text-align: left;
}
.good { color: #00ff99; font-weight: bold; }
.bad { color: #ff4d4d; font-weight: bold; }
#circleBox {
  width: 120px;
  height: 120px;
  margin: 20px auto;
  position: relative;
}
#riskCircle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 12px solid green;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
}
#warningText {
  margin-top: 10px;
  font-size: 13px;
}
.info {
  margin-top: 15px;
  font-size: 12px;
  opacity: 0.9;
}
</style>
</head>
<body>

<div class="container">
  <div class="title">🛡 RexSave</div>

  <input id="urlInput" placeholder="Paste website link here">
  <button onclick="startAnalysis()">Analyze</button>

  <!-- Countdown -->
  <div id="circleBox" style="display:none;">
    <div id="circleCountdown" style="width:120px; height:120px; border-radius:50%; border:6px solid #00ff99; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold;">5</div>
  </div>

  <!-- Results -->
  <div id="result" class="result"></div>

  <!-- Risk Circle -->
  <div id="riskCircle" style="display:none;"></div>

  <div id="warningText"></div>

  <div class="info">
    <b>Information:</b><br>
    RexSave analyzes websites for safety, legitimacy, scams, harmful
    behavior, and illegal content. Results are automated estimations and
    should not replace professional judgment.
  </div>
</div>

<script>
function startAnalysis() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return alert("Enter a website link");

  // Hide previous
  document.getElementById("result").innerHTML = "";
  document.getElementById("riskCircle").style.display = "none";
  document.getElementById("warningText").innerHTML = "";

  let time = 5;
  const box = document.getElementById("circleBox");
  const countdown = document.getElementById("circleCountdown");
  box.style.display = "block";
  countdown.innerText = time;

  const timer = setInterval(() => {
    time--;
    countdown.innerText = time;
    if (time === 0) {
      clearInterval(timer);
      box.style.display = "none";
      analyze(url);
    }
  }, 1000);
}

function analyze(url) {
  // Simple simulation of percentages
  let riskPercent = Math.floor(Math.random() * 100); // 0–99%
  let isSafe = riskPercent > 50;
  let isScam = /free|bonus|verify|login|crypto|wallet/i.test(url);
  let isIllegal = /hack|crack|pirate|cheat/i.test(url);
  let isHarmful = isScam || isIllegal;
  let isReal = !isScam && !isIllegal;

  // Show results
  document.getElementById("result").innerHTML = `
    REAL: <span class="${isReal ? 'good':'bad'}">${isReal?'YES':'NO ❗'}</span><br>
    SAFE: <span class="${isSafe?'good':'bad'}">${isSafe?'YES':'NO ❗'}</span><br>
    HARMFUL: <span class="${isHarmful?'bad':'good'}">${isHarmful?'YES ❗':'NO'}</span><br>
    SCAM: <span class="${isScam?'bad':'good'}">${isScam?'YES ❗':'NO'}</span><br>
    ILLEGAL: <span class="${isIllegal?'bad':'good'}">${isIllegal?'YES ❗':'NO'}</span>
  `;

  // Risk circle
  const circle = document.getElementById("riskCircle");
  circle.style.display = "flex";
  circle.innerText = `${riskPercent}%`;

  // Color based on percentage
  if(riskPercent===100) circle.style.borderColor = "#006400"; // dark green
  else if(riskPercent>=90) circle.style.borderColor = "#00ff00"; // green
  else if(riskPercent>=70) circle.style.borderColor = "#00bfff"; // blue
  else if(riskPercent>=50) circle.style.borderColor = "#ffff00"; // yellow
  else if(riskPercent>=30) circle.style.borderColor = "#ff8000"; // orange
  else circle.style.borderColor = "#ff0000"; // red

  // Warning text
  const warn = document.getElementById("warningText");
  if(riskPercent>=90) warn.innerText = "✅ Safe to enter.";
  else if(riskPercent>=70) warn.innerText = "⚠️ Mostly safe, proceed with caution.";
  else if(riskPercent>=50) warn.innerText = "⚠️ Some risk detected, stay alert.";
  else if(riskPercent>=30) warn.innerText = "❌ High risk! Avoid entering.";
  else warn.innerText = "❌ Dangerous website! Do NOT enter!";
}
</script>

</body>
</html>
