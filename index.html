<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Safety Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background: #0b0b0b;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        width: 420px;
        background: #111;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,255,255,0.15);
        text-align: center;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        margin-bottom: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #00bfff;
        color: #000;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #00ffff;
    }

    .circle-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 25px;
    }

    .circle {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 8px solid #555;
        display: none;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        font-weight: bold;
    }

    .status {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .warning {
        margin-top: 10px;
        font-size: 14px;
        color: #ff4d4d;
    }
</style>
</head>

<body>
<div class="container">
    <h2>Link Safety Analyzer</h2>

    <input type="text" id="urlInput" placeholder="Enter URL to analyze">
    <button onclick="analyze()">Analyze</button>

    <div class="circle-wrapper">
        <div class="circle" id="riskCircle">0%</div>
    </div>

    <div class="status" id="statusText"></div>
    <div class="warning" id="warningText"></div>
</div>

<script>
function analyze() {
    const url = document.getElementById("urlInput").value.trim();
    const circle = document.getElementById("riskCircle");
    const statusText = document.getElementById("statusText");
    const warningText = document.getElementById("warningText");

    if (!url) {
        alert("Please enter a URL");
        return;
    }

    let score = 100;

    // ---------- ANALYZER RULES (DETERMINISTIC) ----------

    if (!url.startsWith("http")) score -= 20;
    if (url.length > 90) score -= 15;
    if (url.includes("@")) score -= 30;
    if (url.match(/\d{3,}/)) score -= 10;
    if (url.match(/(login|verify|secure|update|account|bank)/i)) score -= 15;
    if (url.match(/(bit\.ly|tinyurl|rb\.gy|t\.co)/i)) score -= 25;
    if (url.match(/\.(exe|apk|zip|rar|scr)$/i)) score -= 35;
    if (url.split(".").length > 4) score -= 10;

    if (score < 0) score = 0;

    // ---------- UI UPDATE ----------

    circle.style.display = "flex";
    circle.textContent = score + "%";

    warningText.textContent = "";

    if (score >= 90) {
        circle.style.borderColor = "#00ff00";
        statusText.textContent = "SAFE";
        statusText.style.color = "#00ff00";
    }
    else if (score >= 70) {
        circle.style.borderColor = "#00bfff";
        statusText.textContent = "LOW RISK";
        statusText.style.color = "#00bfff";
    }
    else if (score >= 50) {
        circle.style.borderColor = "#ffff00";
        statusText.textContent = "MEDIUM RISK";
        statusText.style.color = "#ffff00";
        warningText.textContent = "⚠️ Be cautious before proceeding.";
    }
    else if (score >= 30) {
        circle.style.borderColor = "#ff8000";
        statusText.textContent = "HIGH RISK";
        statusText.style.color = "#ff8000";
        warningText.textContent = "⚠️ Dangerous link. Do NOT enter personal data.";
    }
    else {
        circle.style.borderColor = "#ff0000";
        statusText.textContent = "EXTREMELY DANGEROUS";
        statusText.style.color = "#ff0000";
        warningText.textContent = "❌ DO NOT OPEN THIS LINK.";
    }
}
</script>
</body>
</html>
