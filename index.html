<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RexSave Analyzer</title>

  <!-- KEEP OR REPLACE WITH YOUR OWN CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1f14;
      color: #eaffea;
      padding: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .yes {
      color: #2aff2a;
      font-weight: bold;
    }

    .no {
      color: #ff3b3b;
      font-weight: bold;
    }

    .warn {
      color: #ff3b3b;
      font-weight: bold;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #2aff2a;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>RexSave Website Analyzer</h1>

  <p>
    <strong>Information:</strong><br>
    This website analyzes links to detect potential risks such as scams,
    illegal content, phishing attempts, and unsafe behavior.  
    The result is an automated risk estimation and does NOT replace human judgment.
  </p>

  <input id="urlInput" placeholder="Paste website link here">
  <button onclick="analyze()">Analyze</button>

  <div id="result" class="box"></div>

  <script src="analyzer.js"></script>
</body>
</html>
