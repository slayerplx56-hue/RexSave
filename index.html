<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Safety Analyzer</title>

<style>
body {
    background:#0e0e0e;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box {
    width:420px;
    background:#141414;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

input {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    outline:none;
    margin-bottom:10px;
}

button {
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#00bcd4;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:#00e5ff;
}

.circle-container {
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.circle {
    width:130px;
    height:130px;
    border-radius:50%;
    border:8px solid #555;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.status {
    font-size:18px;
    font-weight:bold;
}

.warning {
    margin-top:8px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">
    <h3>Website Safety Analyzer</h3>

    <input id="url" placeholder="Enter website link">
    <button onclick="analyze()">Analyze</button>

    <div class="circle-container">
        <div id="circle" class="circle">0%</div>
    </div>

    <div id="status" class="status"></div>
    <div id="warning" class="warning"></div>
</div>

<script>
function analyze() {
    const input = document.getElementById("url").value.trim();
    const circle = document.getElementById("circle");
    const status = document.getElementById("status");
    const warning = document.getElementById("warning");

    if (!input) return alert("Enter a link");

    let score = 100;

    // -------- STRONG RULE-BASED ANALYZER --------

    if (!input.startsWith("http")) score -= 20;
    if (input.length > 80) score -= 15;
    if (input.includes("@")) score -= 30;
    if (input.match(/\d{4,}/)) score -= 10;
    if (input.split(".").length > 4) score -= 10;

    if (/(login|verify|secure|update|account|wallet|bank)/i.test(input))
        score -= 15;

    if (/(bit\.ly|tinyurl|t\.co|rb\.gy|is\.gd)/i.test(input))
        score -= 25;

    if (/\.(exe|apk|zip|rar|scr)$/i.test(input))
        score -= 35;

    if (/(free|bonus|winner|prize|claim)/i.test(input))
        score -= 15;

    if (score < 0) score = 0;

    // -------- DISPLAY --------

    circle.style.display = "flex";
    circle.textContent = score + "%";
    warning.textContent = "";

    if (score >= 90) {
        circle.style.borderColor = "lime";
        status.textContent = "SAFE";
        status.style.color = "lime";
    } 
    else if (score >= 70) {
        circle.style.borderColor = "#00e5ff";
        status.textContent = "LOW RISK";
        status.style.color = "#00e5ff";
    } 
    else if (score >= 50) {
        circle.style.borderColor = "yellow";
        status.textContent = "MEDIUM RISK";
        status.style.color = "yellow";
        warning.textContent = "⚠ Be careful entering information.";
    } 
    else if (score >= 30) {
        circle.style.borderColor = "orange";
        status.textContent = "HIGH RISK";
        status.style.color = "orange";
        warning.textContent = "⚠ Dangerous website. Do NOT enter data.";
    } 
    else {
        circle.style.borderColor = "red";
        status.textContent = "EXTREMELY DANGEROUS";
        status.style.color = "red";
        warning.textContent = "❌ DO NOT OPEN THIS LINK.";
    }
}
</script>

</body>
</html>
